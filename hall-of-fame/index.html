<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Hall of Fame</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .cloud-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 100px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .donor {
            position: absolute;
            font-weight: bold;
            transition: transform 0.3s ease-in-out;
            white-space: nowrap;
        }
        .donor:hover {
            transform: scale(1.2);
        }
        .center-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            z-index: 10;
            border: 5px solid white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-button">⬅ Back</a>
    <h1>Donation Hall of Fame</h1>
    <div class="cloud-container" id="wordCloud">
        <img src="../images/hpc.png" alt="WitsHPC" class="center-image"> <!-- Center Image -->
    </div>

    <script>
        const donations = [
            { name: "Alice", amount: 500 },
            { name: "Bob", amount: 1200 },
            { name: "Charlie", amount: 300 },
            { name: "Diana", amount: 800 },
            { name: "Edward", amount: 2000 },
            { name: "Fiona", amount: 450 },
            { name: "George", amount: 900 }
        ];

        const maxDonation = Math.max(...donations.map(d => d.amount));
        const cloudContainer = document.getElementById("wordCloud");
        const centerX = 200, centerY = 200, radius = 120; // Adjusted for image

        donations.forEach((donor, index) => {
            const angle = (index / donations.length) * (2 * Math.PI);
            const x = centerX + radius * Math.cos(angle) - 20; // Offset
            const y = centerY + radius * Math.sin(angle) - 20; // Offset

            const donorElement = document.createElement("span");
            const fontSize = Math.max(16, (donor.amount / maxDonation) * 40);
            
            donorElement.textContent = donor.name;
            donorElement.classList.add("donor");
            donorElement.style.fontSize = `${fontSize}px`;
            donorElement.style.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
            donorElement.style.left = `${x}px`;
            donorElement.style.top = `${y}px`;

            cloudContainer.appendChild(donorElement);
        });
    </script>

</body>
</html>
